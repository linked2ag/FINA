  Der Quelltext dieser Seite ist einsehbar, weil ein Browser ihn zum

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="copyright" content="Copyright (c) 2026 Alex (github.com/linked2ag). Alle Rechte vorbehalten.">
<title>FINA Book — your whole finance in one place</title>

<!-- Dasselbe Bild, aus dem die Mac- und die Windows-App ihr Symbol
     bekommen (icon.png im Stamm, gezeichnet aus
     desktop/build/icon.html). Ein Reiter zeigt es klein: dass die
     drei Farben links auch dann noch zu erkennen sind, ist der
     Grund für ihre Breite. -->
<link rel="icon" href="icon.png" sizes="any">

<!-- Gestaltung — Reihenfolge zählt: allgemeine Regeln zuerst,
     spezielle danach.

     Die drei Schriften kamen bis August 2026 von
     fonts.googleapis.com. Sie liegen jetzt in css/fonts/ und werden
     in tokens.css eingebunden: die Seite ruft damit **keinen
     fremden Server mehr auf** — was oben steht, stimmt dann auch
     für die Schriften. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/ledger.css">
<link rel="stylesheet" href="css/matrix.css">
<!-- Die mobile Fassung, alles unter 700 px: sie überschreibt und
     steht deshalb als letzte (siehe isMobile in js/app.js). -->
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<div class="wrap">
<header>
  <div class="masthead">
    <!-- Das Wortzeichen ist im Browser ein Link zur Startseite
         (index.html liegt daneben). In der App ist index.html der
         Web-Client selbst — dort legt renderChrome() den Link
         still (js/app.js, dritte FINA_NATIVE-Stelle). -->
    <div class="brand"><h1><a href="index.html">FINA Book</a></h1><span class="sub" id="yearLbl"></span></div>
    <!-- Die Ansichten als Segmented Control in der Mitte der
         Toolbar; gefüllt von renderChrome(). -->
    <nav class="views" id="views" role="tablist"></nav>
    <div class="hdrright">
      <!-- Verborgen (css/layout.css): der Dateiname steht nur noch
           im Menü. renderStatus() schreibt das Element weiter. -->
      <span class="filepath" id="filePath"></span>
      <!-- Der Hamburger: hinter ihm stecken **alle** Aktionsknöpfe,
           auf jeder Breite (Mac-Redesign 22.8.26). Der rote Punkt
           (#dirtyDot, js/storage.js) sagt „ungespeichert" auch
           dann, wenn der Dateiname nicht mehr in der Zeile steht. -->
      <!-- Eine offene Umfrage wartet hier: orange, links vom
           Hamburger, auf derselben Höhe. Von selbst springt nichts
           auf — wer antwortet und absendet, wird den Knopf los
           (surveyOpen() in js/dialogs/umfrage.js, gezeigt in
           renderChrome). -->
      <button class="btn srvbtn" id="btnSurvey"
        data-t="srv.open" data-ttip="srv.openTip" hidden></button>
      <button class="burger" id="btnMenu" aria-expanded="false"
        aria-controls="hdrTools" hidden>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dirtydot" id="dirtyDot" hidden></span>
      </button>
      <!-- Das Menü hinter dem Hamburger. Beschriftungen über data-t,
           Tooltips über data-ttip (siehe renderChrome). Öffnen und
           Schließen: js/app.js, unten bei den festen Schaltflächen.
           Reihenfolge mit Trennern (.mi-sep schließt eine Gruppe ab):
           Datei ‖ Neu anlegen ‖ Einstellungen ‖ Anleitung. -->
      <div class="tools" id="hdrTools">
        <!-- Der Dateiname steht als Menükopf immer zuoberst (css:
             .menufile, gefüllt in renderStatus) — man sieht, an
             welcher Datei die Knöpfe darunter arbeiten. -->
        <span class="menufile" id="menuFile" hidden></span>
        <button class="btn" id="btnLoad" data-t="app.load" data-ttip="app.loadTip"></button>
        <button class="btn" id="btnSave" data-t="app.save" data-ttip="app.saveTip"></button>
        <!-- Eine Kopie mit Zeitstempel im Namen, neben der laufenden
             Datei her (js/storage.js). -->
        <button class="btn" id="btnBackup" data-t="app.backup" data-ttip="app.backupTip"></button>
        <button class="btn" id="btnUnlink" data-t="app.unlink" data-ttip="app.unlinkTip"></button>
        <!-- Derselbe Weg wie der Bereich „Import" der Einstellungen
             (#impFast): erst das Fenster, das sagt, was die Datei
             braucht, dann die Dateiauswahl. -->
        <button class="btn mi-sep" id="btnImportCsv" data-t="menu.csv" data-ttip="menu.csvTip"></button>
        <!-- CSV Import 2.0 — der Prototyp des generischen Imports.
             Er liegt in _BusinessCenter/ und damit außerhalb des
             Repositories; den Eintrag zeigt renderChrome (js/app.js)
             nur per file:// ohne App. -->
        <button class="btn mi-sep" id="btnImportCsv2" data-t="menu.csv2" data-ttip="menu.csv2Tip" hidden></button>
        <!-- Die beiden Wege, etwas anzulegen (Regel 1: verdrahtet
             in js/app.js unten). Eine eigene Zeile für die Einnahme
             gibt es nicht mehr: der reguläre Eintrag geht ohne
             Vorauswahl auf, und dort stehen Einnahmen und Kosten in
             derselben Auswahlliste. -->
        <button class="btn mi-new" id="mNewFlex" data-t="menu.newFlex"></button>
        <button class="btn mi-new mi-sep" id="mNewOut" data-t="menu.newOut"></button>
        <button class="btn mi-sep" id="btnSettings" data-t="app.settings" data-ttip="app.settingsTip"></button>
        <!-- Der einzige farbige Eintrag: er klappt die Anleitung
             rechts auf und wieder zu (aria-pressed sagt, ob sie
             offen ist). -->
        <button class="btn guidebtn" id="btnGuide" aria-pressed="false" data-t="app.guide" data-ttip="app.guideTip"></button>
      </div>
    </div>
  </div>
  <!-- Die Monatsleiste stand bis 22.8.26 hier. Sie steht jetzt
       unter der Filterzeile der Monatsansicht, an derselben Stelle,
       an der die Jahresmatrix ihre Monate hat — gebaut in
       monthTabs() (js/views/monat.js), verdrahtet über data-mtab
       in wire(). Die Kopfzeile ist damit in jeder Ansicht gleich
       hoch. -->
</header>

<!-- Hier zeichnet js/app.js die gewählte Ansicht. -->
<main id="view"></main>
<p class="status" id="storeStatus"></p>
</div>

<!-- Die Ansichtswahl der mobilen Fassung, fest am unteren Rand:
     ‹ · Aufklappliste · › statt einer Reiterzeile (seit 23.8.26).
     Gefüllt von renderChrome() aus VIEWS — dieselbe Liste wie die
     Segmented Control oben. Sichtbar macht sie erst css/mobile.css
     unter 700 px. -->
<nav class="mtabs" id="mtabs" hidden></nav>

<!-- Symbol der Notizlampe -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ic-lamp" viewBox="0 0 24 24">
<path d="M9.5 18.5h5M10.5 21h3M12 3a6 6 0 0 0-3.6 10.8c.6.45.9 1.15.9 1.9v.3h5.4v-.3c0-.75.3-1.45.9-1.9A6 6 0 0 0 12 3z"/></symbol></svg>

<!-- Dateiauswahl, wird über die Schaltflächen ausgelöst -->
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<!-- Zweite Auswahl für die FINA-Tabelle: dieselbe Dateiendung,
     aber ein anderer Leser (js/sheet.js). Ein gemeinsames Feld
     müsste sich merken, wer es geöffnet hat. -->
<input type="file" id="fileSheet" accept=".csv,text/csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<!-- Logik — die Reihenfolge ist verbindlich:
     Sprache zuerst (MONTHS, YEAR und t() hängen daran), dann
     Konstanten und Werkzeuge, dann Zustand und Rechnen, dann die
     Ansichten, zuletzt die Steuerung in app.js. -->
<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/state.js"></script>
<script src="js/categories.js"></script>
<script src="js/calc.js"></script>
<script src="js/storage.js"></script>
<script src="js/csv.js"></script>
<!-- Liest die FINA-Tabelle; benutzt splitCsvLine() aus csv.js und
     steht deshalb dahinter. -->
<script src="js/sheet.js"></script>
<script src="js/ui.js"></script>

<script src="js/views/jahr.js"></script>
<script src="js/views/willkommen.js"></script>
<script src="js/views/monat.js"></script>
<script src="js/views/prognose.js"></script>
<script src="js/views/kakeibo.js"></script>

<script src="js/dialogs/item.js"></script>
<script src="js/dialogs/kakeibo-betraege.js"></script>
<script src="js/dialogs/settings.js"></script>
<script src="js/dialogs/csv-import.js"></script>
<script src="js/dialogs/sheet-import.js"></script>
<script src="js/dialogs/guide.js"></script>
<script src="js/dialogs/umfrage.js"></script>

<script src="js/app.js"></script>
</body>
</html>
